name: Build & Release

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install npm
        run: npm ci

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Generate icons
        run: node generate-icons.js

      # Build NSIS
      - name: Build NSIS
        run: npm run build:nsis

      - name: List output folders
        run: |
          Get-ChildItem -Path "src-tauri/target/release" -Recurse -Include "*.exe","*.msi" | Select-Object FullName,Length

      - name: Upload Portable EXE
        uses: actions/upload-artifact@v4
        with:
          name: MahyarImageTools-Portable
          path: src-tauri/target/release/mahyar-image-tools.exe
          retention-days: 30

      - name: Upload NSIS Installer
        uses: actions/upload-artifact@v4
        with:
          name: MahyarImageTools-Setup
          path: src-tauri/target/release/bundle/nsis/
          retention-days: 30

      - name: Build MSI
        run: npm run build -- --bundles msi

      - name: Upload MSI
        uses: actions/upload-artifact@v4
        with:
          name: MahyarImageTools-MSI
          path: src-tauri/target/release/bundle/msi/
          retention-days: 30

  create-release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: '*'
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -la

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: false
          files: |
            *.exe
            *.msi
          body: |
            ## 📷 Mahyar Image Tools

            ### Downloads:
            - 🖇️ **Portable**: فایل EXE - بدون نیاز به نصب
            - 📦 **Setup (NSIS)**: نصاب ویندوز
            - 📋 **MSI**: فایل MSI برای نصب سازمانی
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
